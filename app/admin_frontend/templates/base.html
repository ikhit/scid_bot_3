<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
  <title>{% block title %}{% endblock %}</title>
</head>

<body>
  <div class="page">
      <header class="d-flex flex-wrap align-items-center justify-content-center justify-content-md-between py-3 mb-4 border-bottom">
      <div class="col-md-3 mb-2 mb-md-0">
      <a href="/" class="d-inline-flex link-body-emphasis text-decoration-none">
          <img class="header_img" src="{{ url_for('static', filename='img/detective.png') }}">
      </a>
      </div>
      <ul class="nav col-12 col-md-auto mb-2 justify-content-center mb-md-0">
        <li><a href="{{ url_for('index')}}" class="nav-link px-2">Главная</a></li>
        <li><a href="{{ url_for('get_products')}}" class="nav-link px-2">Продукты</a></li>
        <li><a href="{{ url_for('get_projects')}}" class="nav-link px-2">Другие проекты</a></li>
      </ul>

      <div class="col-md-3 text-end">
      <button type="button" class="btn btn-outline-primary me-2">Загеристрироваться</button>
      <button type="button" class="btn btn-primary">Войти</button>
      </div>
      </header>
    <main>
      <div class="container">
        {% block content %}{% endblock %}
      </div>
    </main>
    <footer class="d-flex flex-wrap justify-content-between align-items-center py-3 my-4 border-top">
        <div class="col-md-4 d-flex align-items-center">
            <a href="/" class="mb-3 me-2 mb-md-0 text-body-secondary text-decoration-none lh-1">
            <svg class="bi" width="30" height="24"><use xlink:href="#bootstrap"></use></svg>
            </a>
            <span class="mb-3 mb-md-0 text-body-secondary">© 2024 SCID Inc </span>
        </div>
        <a class="text-body-secondary" href="#"><img class="footer_img" src="{{ url_for('static', filename='img/tg.png') }}"></a>
    </footer>
  </div>
</body>
</html>
