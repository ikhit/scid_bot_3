{% extends "base.html" %}

{% block title %} Продукты {% endblock title %}

{% block content %}
  <table class=table>
      <thead>
          <tr>
              <th>Название</th>
              <th>Описание</th>
          </tr>
      </thead>
      <tbody>
          {% for product in products %}
              <tr>
                  <td>{{ product.name }}</td>
                  <td>{{ product.description }}</td>
              </tr>
          {% endfor %}
      </tbody>
  </table>
{% endblock content %}
