<!DOCTYPE html>
<html lang="ru">

<head>
    <script src="/docs/5.3/assets/js/color-modes.js"></script>
    <meta charset="utf-8">
    <link rel="icon" href="{{ url_for('static', filename='img/logo.ico') }}" type="image">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
    <link href="sidebars.css" rel="stylesheet">
    <title>Вход</title>
</head>

<body class="row">
    <main class="container d-flex align-items-center justify-content-center min-vh-100">
        <form method="POST" action="{{ url_for('admin_login') }}">
            <h1 class="h3 fw-normal py-3">Вход в админку SCID-бота</h1>
            <div class="form-floating">
                <input type="text" class="form-control" id="telegram_id" name="telegram_id" placeholder="Ваш телеграм ID" required>
                <label for="telegram_id">Ваш Telegram ID</label>
            </div>
            <button class="btn mt-3 btn-primary w-100 py-2" type="submit">Отправить</button>
        </form>
    </main>
</body>

</html>
